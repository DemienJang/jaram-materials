<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="아무것도 숭배하지 않는 사람은 없다 · 장재식 블로그 카드뉴스"><title>아무것도 숭배하지 않는 사람은 없다 · 카드뉴스</title><link rel="stylesheet" href="./cardnews.css"><script src="./cardnews.js" defer></script></head><body><a href="#cards">카드뉴스로 이동</a><header class="page-header"><div class="brand"><span class="mark">J</span><div><strong>장재식 블로그</strong><div class="meta">TYPOGRAPHIC CARD NEWS · 006</div></div></div><span class="meta">PORTABLE EDITION</span></header><main><section class="intro"><div class="kicker">FAITH · SUCCESS · STANDARD</div><h1>아무것도 숭배하지<br>않는 사람은 없다</h1><p>진로와 성공 앞에서 내가 붙드는 기준은 정말 내가 선택한 것일까. 이 카드뉴스는 불안과 욕망 아래에서 삶의 주인이 된 기준을 다시 묻습니다.</p></section><section class="cards" id="cards"><h2>열 장의 질문</h2><div class="grid">
<figure class="item"><div class="shell"><article class="card cover"><div class="topline"><span>JANG JAESIK · BLOG ESSAY</span><span>01 / 10</span></div><div class="coverbody"><div class="eyebrow">A QUESTION ABOUT SUCCESS</div><h3>아무것도<br>숭배하지 않는<br>사람은 없다</h3><div class="question">내가 성공이라고 믿는 기준은<br><b>정말 내가 선택한 것일까?</b></div></div></article></div><figcaption class="caption"><span>01 · 멈춰 서게 하는 질문</span><a href="?export=1&amp;card=1">원본 보기</a></figcaption></figure>
<figure class="item"><div class="shell"><article class="card light"><div class="topline"><span>SCENE</span><span>02 / 10</span></div><div class="statement">“뭘 하고 싶은지<br>모르겠어요.”<small>관심이 없는 게 아니라,<br>말해도 괜찮은 기준을 잃은 말일 수 있다.</small></div></article></div><figcaption class="caption"><span>02 · 말 뒤에 남은 망설임</span><a href="?export=1&amp;card=2">원본 보기</a></figcaption></figure>
<figure class="item"><div class="shell"><article class="card sage"><div class="topline"><span>LOOK CLOSER</span><span>03 / 10</span></div><div class="statement">진로 앞에서 먼저<br>물어야 할 질문은<br><span class="accent">“뭘 하고 싶을까?”</span>가<br>아닐 때가 있다.<small>내가 무엇을 성공이라고 믿고 있는가.</small></div></article></div><figcaption class="caption"><span>03 · 질문의 방향 바꾸기</span><a href="?export=1&amp;card=3">원본 보기</a></figcaption></figure>
<figure class="item"><div class="shell"><article class="card light"><div class="topline"><span>THE STANDARD</span><span>04 / 10</span></div><h3>괜찮은 삶의<br>기준은 어디서<br>왔을까?</h3><p class="body">좋은 대학, 안정적인 직장, 연봉, 집, 평판, 인정.<br><br>나쁜 것들이 아니라도, 삶의 최종 기준이 되면 나를 평가하기 시작한다.</p></article></div><figcaption class="caption"><span>04 · 기준의 출처</span><a href="?export=1&amp;card=4">원본 보기</a></figcaption></figure>
<figure class="item"><div class="shell"><article class="card dark"><div class="topline"><span>WHERE IT CAME FROM</span><span>05 / 10</span></div><div class="split"><div><strong>부모</strong><p>반복해서 들은 말</p></div><div><strong>학교와 사회</strong><p>성공이라고 배운 기준</p></div><div><strong>알고리즘</strong><p>매일 눈앞에 놓인 비교</p></div></div><p class="foot">“저 정도는 되어야 괜찮은 삶이지.”</p></article></div><figcaption class="caption"><span>05 · 내가 선택했다고 믿은 것</span><a href="?export=1&amp;card=5">원본 보기</a></figcaption></figure>
<figure class="item"><div class="shell"><article class="card blue"><div class="topline"><span>IDOL</span><span>06 / 10</span></div><div class="statement">우상은<br><span class="accent">처음부터 나쁜 얼굴로</span><br>오지 않는다.<small>돈은 안전을 주고,<br>인정은 더 좋은 사람이 되게 하고,<br>성공은 더 노력하게 한다.</small></div></article></div><figcaption class="caption"><span>06 · 좋은 모습으로 시작되는 것</span><a href="?export=1&amp;card=6">원본 보기</a></figcaption></figure>
<figure class="item"><div class="shell"><article class="card light"><div class="topline"><span>THE PARADOX</span><span>07 / 10</span></div><h3>우상은<br>달리게 하지만<br><span class="accent">쉬게 하지는 못한다.</span></h3><p class="body">성공은 “조금만 더”라고 말한다.<br>인정은 “이번 한 번으로는 부족해”라고 말한다.<br><br>그래서 잘하고 있어도 늘 부족하다.</p></article></div><figcaption class="caption"><span>07 · 멈추지 못하는 기준</span><a href="?export=1&amp;card=7">원본 보기</a></figcaption></figure>
<figure class="item"><div class="shell"><article class="card sage"><div class="topline"><span>THE SHIFT</span><span>08 / 10</span></div><div class="statement">내가 성공을<br>사용하는가,<br><span class="accent">성공이 나를 사용하는가?</span><small>내가 돈을 관리하는가,<br>돈이 내 마음을 관리하는가?</small></div></article></div><figcaption class="caption"><span>08 · 주인이 바뀌는 순간</span><a href="?export=1&amp;card=8">원본 보기</a></figcaption></figure>
<figure class="item"><div class="shell"><article class="card dark"><div class="topline"><span>GOSPEL</span><span>09 / 10</span></div><div class="statement">복음은 성취를<br>없애지 않는다.<br><span class="accent">자리를 다시 정렬한다.</span><small>진로는 나를 증명하는 무대가 아니다.<br>직업은 내 가치를 결정하는 이름표가 아니다.</small></div></article></div><figcaption class="caption"><span>09 · 기준을 다시 세우기</span><a href="?export=1&amp;card=9">원본 보기</a></figcaption></figure>
<figure class="item"><div class="shell"><article class="card cover"><div class="topline"><span>TO REMEMBER</span><span>10 / 10</span></div><div class="coverbody"><div class="eyebrow">THE LAST QUESTION</div><h3>나는 지금<br>무엇을<br>예배하고 있는가?</h3><div class="question">그 기준은 나를 자유롭게 하는가,<br>아니면 계속 증명하게 만드는가?</div></div></article></div><figcaption class="caption"><span>10 · 처음 질문으로 돌아가기</span><a href="?export=1&amp;card=10">원본 보기</a></figcaption></figure>
</div></section></main><footer class="page-footer"><span>JANG JAESIK · TYPOGRAPHIC CARD NEWS SYSTEM</span><span>© 2026 장재식. All rights reserved.</span></footer></body></html>
